apiVersion: switchyard.dev/v1alpha2
kind: Deployment
metadata:
  name: {{project_name}}
spec:
  overlays:
    - overlays/dev.yaml
  sources:
    project: { path: . }
    # Register another local checkout or managed worktree, then add it here:
    # feature: { type: worktree, path: .switchyard/worktrees/feature }
  blocks:
    web:
      services:
        server:
          execution:
            type: container
            image: nginx:alpine
          probe: { type: http, path: /, port: 80 }
          publish: [80]

    # A multi-service block can still express local lifecycle dependencies:
    # client:
    #   services:
    #     helper:
    #       execution: { type: container, image: busybox:latest, command: ["sleep", "infinity"] }
    #       probe: { type: command, command: ["true"] }
    #     app:
    #       execution: { type: container, image: busybox:latest, command: ["sleep", "infinity"] }
    #       dependsOn:
    #         helper: healthy
  instances:
    - { name: web, block: web, source: project }
  groups:
    default:
      instances: [web]
