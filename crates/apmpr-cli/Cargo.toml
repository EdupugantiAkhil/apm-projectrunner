[package]
name = "apmpr-cli"
description = "One-shot Docker lifecycle CLI for APM ProjectRunner deployments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "apmpr"
path = "src/main.rs"

[dependencies]
http = "1.3.1"
router-config = { path = "../router-config" }
local-ip-address = "0.6.13"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
sha2 = "0.10.8"
apmpr-planner = { path = "../apmpr-planner" }
apmpr-daemon = { path = "../apmpr-daemon" }
apmpr-docker-ssh = { path = "../apmpr-docker-ssh" }
apmpr-ops = { path = "../apmpr-ops" }
apmpr-adapter-sdk = { path = "../apmpr-adapter-sdk" }
apmpr-adapters = { path = "../apmpr-adapters" }
apmpr-router-admin = { path = "../apmpr-router-admin" }
apmpr-sources = { path = "../apmpr-sources" }
apmpr-state = { path = "../apmpr-state" }
apmpr-tui = { path = "../apmpr-tui" }
ureq = "3.1.2"

[dev-dependencies]
axum = "0.8.8"
http-body-util = "0.1.3"
tempfile = "3.20.0"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "time"] }
tower = "0.5.3"

[lints]
workspace = true
