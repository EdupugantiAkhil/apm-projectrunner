apiVersion: apmpr.dev/v1alpha2
kind: Deployment
metadata:
  name: comparison
spec:
  repositories:
    fixture: { url: ../../../.. }
  sources:
    app:
      repository: fixture
      ref: HEAD
      path: source
  blocks:
    provider:
      services:
        api:
          execution:
            type: container
            image: example/provider:1
            command: ["serve", "--port", "8080"]
          publish: [8080]
          volumes:
            - { name: data, target: /data }
          probe: { type: http, path: /health, port: 8080 }
    consumer:
      parameters:
        LOG_LEVEL: { required: true }
      services:
        api:
          execution:
            type: script
            image: example/consumer:1
            command: ["./start"]
            workingDirectory: /workspace
            environment: { STATIC_VALUE: yes }
          probe: { type: tcp, port: 3000 }
    suite:
      services:
        processes:
          execution:
            type: processCompose
            image: example/process-compose:1
            file: process-compose.yaml
  instances:
    - { name: provider-main, block: provider, source: app }
    - { name: provider-feature, block: provider, source: app }
    - name: consumer-a
      block: consumer
      source: app
      parameters: { LOG_LEVEL: debug }
    - name: consumer-b
      block: consumer
      source: app
      parameters: { LOG_LEVEL: info }
    - { name: suite-main, block: suite, source: app }
  groups:
    base:
      instances: [provider-main/api, consumer-a/api]
    feature:
      instances: [provider-feature/api, consumer-b/api]
