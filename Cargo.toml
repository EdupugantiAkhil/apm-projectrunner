[workspace]
members = [
    "crates/router-config",
    "crates/router-core",
    "crates/router-pingora",
    "crates/router-tcp",
    "crates/apmpr-adapter-sdk",
    "crates/apmpr-adapters",
    "crates/apmpr-cli",
    "crates/apmpr-daemon",
    "crates/apmpr-devices",
    "crates/apmpr-docker-ssh",
    "crates/apmpr-ops",
    "crates/apmpr-planner",
    "crates/apmpr-profiles",
    "crates/apmpr-router",
    "crates/apmpr-router-admin",
    "crates/apmpr-run-actions",
    "crates/apmpr-sources",
    "crates/apmpr-state",
    "crates/apmpr-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
